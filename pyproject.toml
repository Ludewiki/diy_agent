[project]
name = "project-of-python"
version = "0.5.0"
description = "Weather-aware multi-tool AI Agent for global travel itinerary planning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "dashscope>=1.26.3",
    "fastapi>=0.116.0",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.9",
    "mwparserfromhell>=0.7.2",
    "openai>=2.45.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "opentelemetry-instrumentation-requests>=0.60b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
    "opentelemetry-sdk>=1.39.0",
    "pydantic>=2",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=1.0.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "notebook>=7.6.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that call live third-party services",
    "postgres: tests that require a dedicated PostgreSQL test database",
]
