name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+psycopg://diy_agent:ci-password@localhost:5432/diy_agent_test
      TEST_DATABASE_URL: postgresql+psycopg://diy_agent:ci-password@localhost:5432/diy_agent_test
      PYTHONUTF8: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: diy_agent_test
          POSTGRES_USER: diy_agent
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diy_agent -d diy_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Validate migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run unit tests
        run: uv run pytest -m "not postgres"

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m postgres

      - name: Build application image
        run: docker build --tag diy-agent:${{ github.sha }} .
