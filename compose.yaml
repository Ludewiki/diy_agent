name: diy-agent

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diy_agent}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-diy_agent}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ORS_API_KEY: ${ORS_API_KEY:-}
  WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-TravelPlannerAgent/0.3}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PYTHONUTF8: "1"
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120.0}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30.0}
  WORKER_RETRY_DELAY_SECONDS: ${WORKER_RETRY_DELAY_SECONDS:-5.0}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
  CONTEXT_MAX_INPUT_TOKENS: ${CONTEXT_MAX_INPUT_TOKENS:-12000}
  CONTEXT_SYSTEM_RESERVED_TOKENS: ${CONTEXT_SYSTEM_RESERVED_TOKENS:-1400}
  CONTEXT_TOOL_RESERVED_TOKENS: ${CONTEXT_TOOL_RESERVED_TOKENS:-3200}
  CONTEXT_OUTPUT_RESERVED_TOKENS: ${CONTEXT_OUTPUT_RESERVED_TOKENS:-1800}
  CONTEXT_RECENT_MESSAGE_LIMIT: ${CONTEXT_RECENT_MESSAGE_LIMIT:-8}
  CONTEXT_SUMMARY_MAX_TOKENS: ${CONTEXT_SUMMARY_MAX_TOKENS:-1200}
  AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-6}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
  SSE_POLL_SECONDS: ${SSE_POLL_SECONDS:-0.5}
  SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15.0}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-diy_agent_session}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-diy_agent_csrf}
  AUTH_SESSION_LIFETIME_DAYS: ${AUTH_SESSION_LIFETIME_DAYS:-7}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-5000}
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
  OTEL_SERVICE_NAME_PREFIX: ${OTEL_SERVICE_NAME_PREFIX:-diy-agent}
  OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}

x-app-service: &app-service
  build:
    context: .
  image: diy-agent:local
  environment: *runtime-environment
  init: true

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_EXPORTER_PORT:-8889}:8889"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diy_agent}
      POSTGRES_USER: ${POSTGRES_USER:-diy_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    restart: unless-stopped

  migration:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migration:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app-service
    command: ["python", "-m", "app.worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  postgres-data-v18:
  prometheus-data:
